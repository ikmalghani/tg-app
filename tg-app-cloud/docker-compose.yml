services:
  app:
    build:
      context: ..
      dockerfile: tg-app-cloud/Dockerfile
    container_name: tg-app-cloud
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      TG_UPLOAD_DIR: /app/tg-upload
      CRYPT_CONFIG: /app/crypt.conf
    volumes:
      - ./data:/data
      - ./crypt.conf:/app/crypt.conf:ro
    # Coolify (or local debug) proxies to this port. Do not expose it raw on the public internet.
    ports:
      - "8000:8000"
    restart: unless-stopped
